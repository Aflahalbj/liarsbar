modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Dibundel (jarJar).
[[dependencies.${mod_id}]]
    modId="veil"
    mandatory=true
    versionRange="[1.0.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="[1.0.2-rc1+1.20,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="bendylib"
    mandatory=true
    versionRange="[4.0.0,)"
    ordering="NONE"
    side="CLIENT"

# Dipasang sendiri.
[[dependencies.${mod_id}]]
    modId="geckolib"
